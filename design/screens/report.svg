<svg xmlns="http://www.w3.org/2000/svg" width="375" height="740" viewBox="0 0 375 740"><title>오늘 정상 report · 375px 디자인 프레임</title><rect x="0" y="0" width="375" height="740" rx="0" fill="#FCFBF7" stroke="none"/><text x="24" y="62" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" fill="#20372D" font-weight="700" text-anchor="start">지금 계신 봉우리 이름을</text><text x="24" y="96" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" fill="#20372D" font-weight="700" text-anchor="start">알려주세요</text><rect x="24" y="138" width="327" height="58" rx="16" fill="white" stroke="#B9C7B8"/><text x="40" y="174" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#657168" font-weight="400" text-anchor="start">예: 문수봉</text><text x="351" y="221" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#657168" font-weight="400" text-anchor="end">0 / 20</text><text x="24" y="270" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#657168" font-weight="400" text-anchor="start">이름과 지금 위치만 보내요. 다른 사람에게는</text><text x="24" y="297" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#657168" font-weight="400" text-anchor="start">보이지 않고, 정상 좌표를 고칠지 판단하는 데만</text><text x="24" y="324" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#657168" font-weight="400" text-anchor="start">써요. 개인정보는 적지 말아주세요.</text><rect x="24" y="650" width="327" height="56" rx="16" fill="#1F6B4A" stroke="none"/><text x="187.5" y="685" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">보내기</text></svg>